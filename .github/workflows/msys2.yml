name: msys2

on:
  workflow_dispatch:
  push:
    paths:
      - '**'
      - '!.github/**'
      - '.github/workflows/msys2.yml'
      - '!**.md'
  pull_request:
    paths:
      - '**'
      - '!.github/**'
      - '.github/workflows/msys2.yml'
      - '!**.md'

jobs:
  msys2:
    runs-on: ${{matrix.arch.runs-on}}

    env:
      MSYS_ARCH: ${{matrix.arch.msys-arch}}
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      CL_WX_VERSION: ${{matrix.wx-version}}

    strategy:
      fail-fast: false
      matrix:
        # TODO: add '3.2' back (it fails to build now)
        wx-version: ['master']
        arch:
          - msystem: clang64
            runs-on: windows-latest
            msys-arch: clang-x86_64
          - msystem: clangarm64
            runs-on: windows-11-arm
            msys-arch: clang-aarch64
            package-suffix: '-arm64'

    steps:
    - uses: msys2/setup-msys2@v2
      id: msys2
      with:
        msystem: ${{matrix.arch.msystem}}
        update: true
        location: ${{ matrix.arch.runs-on == 'windows-11-arm' && 'C:\' || '' }}
        cache: ${{ matrix.arch.runs-on != 'windows-11-arm' }}
        release: false
        install: >-
          bison
          flex
          patch
        # These packages are installed here so they are cached. build.sh installs them too (already present, so they
        # are skipped by --needed), plus a few more
        pacboy: >-
          cmake:p
          make:p
          clang:p
          clang-tools-extra:p
          zlib:p
          libssh:p
          hunspell:p
          openssl:p
          sqlite3:p
          llvm-openmp:p
          libmariadbclient:p
          ntldd:p
          postgresql:p
          glew:p

    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    # build.sh builds wxWidgets inside the build folder and uses it for both wxCrafter and CodeLite

    # wxCrafter
    - name: build and create wxCrafter installer
      shell: msys2 {0}
      run: |
        export MSYS2_BASE=$(cygpath -u "${{steps.msys2.outputs.msys2-location}}")
        ./build.sh package_wxcrafter

    # Upload installer
    - name: artifact
      uses: actions/upload-artifact@v7
      with:
        name: wxcrafter-installer-wx-${{matrix.wx-version}}${{matrix.arch.package-suffix}}
        path: |
          .build-release-wxcrafter/installer/**.*

    # CodeLite
    - name: Build and create CodeLite installer
      shell: msys2 {0}
      run: |
        export MSYS2_BASE=$(cygpath -u "${{steps.msys2.outputs.msys2-location}}")
        ./build.sh --tests package

    - name: Test
      shell: msys2 {0}
      run: |
        cd .build-release
        ctest --output-on-failure

    # Upload and test installer
    - name: artifact
      uses: actions/upload-artifact@v7
      with:
        name: codelite-installer-wx-${{matrix.wx-version}}${{matrix.arch.package-suffix}}
        path: |
          .build-release/installer/**.*
    
    - name: Run installer
      shell: pwsh
      run: Start-Process -wait -FilePath .\.build-release\installer\codelite-*-*.exe -ArgumentList "/SILENT /SP- /SUPPRESSMSGBOXES /NOICONS /NORESTART"
    
    - name: Show content of installation
      shell: bash
      run: ls -lR "/C/Program Files/Codelite"
