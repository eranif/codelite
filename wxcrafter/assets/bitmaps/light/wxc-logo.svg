  <rect x="38" y="8" width="64" height="64" rx="15" fill="url(#blueRim)"/>
  <rect x="42" y="12" width="56" height="56" rx="12" fill="url(#blueBody)"/>
  <rect x="45" y="15" width="32" height="32" rx="9" fill="url(#shine)"/>
  <!-- yellow -->
  <rect x="72" y="46" width="64" height="64" rx="15" fill="url(#yellowRim)"/>
  <rect x="76" y="50" width="56" height="56" rx="12" fill="url(#yellowBody)"/>
